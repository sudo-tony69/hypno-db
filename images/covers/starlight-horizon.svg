<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg4)"/>
  
  <rect x="0" y="280" width="600" height="120" fill="url(#horizon)"/>
  <line x1="0" y1="280" x2="600" y2="280" stroke="#7dd3fc" stroke-width="4"/>
  
  <g fill="#ffffff" opacity="0.8">
    <circle cx="120" cy="120" r="2"/>
    <circle cx="240" cy="80" r="3"/>
    <circle cx="450" cy="140" r="2.5"/>
    <circle cx="500" cy="70" r="1.5"/>
    <circle cx="350" cy="190" r="2"/>
    <circle cx="80" cy="210" r="3"/>
  </g>

  <text x="50" y="520" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="1">STARLIGHT HORIZON</text>
  <text x="50" y="555" font-family="system-ui, sans-serif" font-size="20" font-weight="500" fill="#bae6fd" letter-spacing="2">AETHERIA (LIVE TAKE)</text>
</svg>
