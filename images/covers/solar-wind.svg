<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="1"/>
      <stop offset="30%" stop-color="#f97316" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#ef4444" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg2)"/>
  <circle cx="300" cy="300" r="220" fill="url(#sun)"/>
  
  <!-- Spiral solar rings -->
  <path d="M 300 120 C 400 120, 480 200, 480 300 C 480 400, 400 480, 300 480 C 200 480, 120 400, 120 300" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.6"/>
  <path d="M 300 180 C 370 180, 420 230, 420 300 C 420 370, 370 420, 300 420 C 230 420, 180 370, 180 300" fill="none" stroke="#f97316" stroke-width="4" stroke-dasharray="16 10" opacity="0.8"/>
  <circle cx="300" cy="300" r="40" fill="#fef08a"/>

  <text x="50" y="520" font-family="system-ui, sans-serif" font-size="36" font-weight="800" fill="#ffffff" letter-spacing="1">SOLAR WIND ECHOES</text>
  <text x="50" y="555" font-family="system-ui, sans-serif" font-size="20" font-weight="500" fill="#fde68a" letter-spacing="2">AETHERIA</text>
</svg>
