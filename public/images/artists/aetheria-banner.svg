<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#31104b"/>
    </linearGradient>
    <radialGradient id="nebulaGlow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bannerBg)"/>
  <rect width="1200" height="400" fill="url(#nebulaGlow)"/>
  
  <!-- Waveform lines -->
  <path d="M 0 260 Q 300 120 600 240 T 1200 180" fill="none" stroke="#6366f1" stroke-width="3" opacity="0.4"/>
  <path d="M 0 280 Q 250 180 550 290 T 1200 210" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.5"/>
  <path d="M 0 220 Q 350 300 700 160 T 1200 250" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.3"/>
  
  <!-- Audio frequency bars -->
  <g opacity="0.15" fill="#ffffff">
    <rect x="100" y="280" width="6" height="40" rx="3"/>
    <rect x="115" y="240" width="6" height="80" rx="3"/>
    <rect x="130" y="200" width="6" height="120" rx="3"/>
    <rect x="145" y="250" width="6" height="70" rx="3"/>
    <rect x="160" y="220" width="6" height="100" rx="3"/>
    <rect x="1040" y="220" width="6" height="100" rx="3"/>
    <rect x="1055" y="200" width="6" height="120" rx="3"/>
    <rect x="1070" y="250" width="6" height="70" rx="3"/>
    <rect x="1085" y="270" width="6" height="50" rx="3"/>
  </g>
</svg>
