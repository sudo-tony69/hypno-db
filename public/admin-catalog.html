<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hypno DB Catalog Admin</title>
    <style>
      :root {
        --bg: #0b0d12;
        --panel: #141922;
        --panel-strong: #1b2330;
        --border: rgba(255,255,255,0.08);
        --text: #eef3ff;
        --muted: #b4bed2;
        --accent: #8ad7ff;
        --accent-strong: #4fb3ff;
        --danger: #ff7b7b;
        --warn: #f8c76f;
        --success: #71e5a7;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, "Segoe UI", sans-serif;
      }

      body {
        padding: 32px 20px 60px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3rem);
        letter-spacing: -0.06em;
      }

      .toolbar {
        display: flex;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 12px;
      }

      button {
        appearance: none;
        border: 1px solid var(--border);
        background: var(--panel-strong);
        color: var(--text);
        border-radius: 10px;
        padding: 10px 16px;
        cursor: pointer;
        font-weight: 600;
        transition: 0.2s ease;
      }

      button:hover {
        border-color: rgba(138, 215, 255, 0.6);
        transform: translateY(-1px);
      }

      .primary {
        background: linear-gradient(135deg, var(--accent-strong), #7d8dff);
        border-color: transparent;
        color: #07111c;
      }

      .danger { background: rgba(255, 123, 123, 0.15); }

      .status {
        margin: 12px 0 20px;
        background: rgba(138, 215, 255, 0.08);
        border: 1px solid rgba(138, 215, 255, 0.24);
        color: var(--muted);
        border-radius: 12px;
        padding: 12px 14px;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
        margin-bottom: 22px;
      }

      .stat-card {
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.02);
        border-radius: 14px;
        padding: 16px;
      }

      .stat-label {
        display: block;
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .stat-value {
        display: block;
        margin-top: 8px;
        font-size: clamp(1.5rem, 3vw, 2rem);
        font-weight: 800;
      }

      .section {
        margin-bottom: 28px;
      }

      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
      }

      .section-head h2 {
        margin: 0;
        font-size: 1.2rem;
      }

      .items {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .item-card {
        border: 1px solid var(--border);
        background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
        border-radius: 16px;
        padding: 18px;
      }

      .item-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
      }

      .item-summary {
        cursor: pointer;
        gap: 12px;
        margin-bottom: 0;
        padding: 6px 2px;
      }

      .summary-main {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .summary-label {
        font-size: 0.7rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .summary-main strong {
        font-size: 1rem;
      }

      .summary-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .ghost {
        background: rgba(255,255,255,0.02);
      }

      .details {
        display: none;
        padding-top: 18px;
      }

      .details.open {
        display: block;
      }

      .item-header h3 {
        margin: 0;
        font-size: 1.05rem;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px 16px;
      }

      .field { display: flex; flex-direction: column; gap: 6px; }
      .field.full { grid-column: 1 / -1; }

      label {
        font-size: 0.78rem;
        color: var(--muted);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      input, textarea {
        width: 100%;
        border: 1px solid var(--border);
        background: rgba(11,13,18,0.8);
        color: var(--text);
        border-radius: 10px;
        padding: 10px 12px;
        font: inherit;
      }

      textarea {
        min-height: 96px;
        resize: vertical;
      }

      .helper {
        font-size: 0.8rem;
        color: var(--muted);
        margin-top: 4px;
      }

      .empty {
        border: 1px dashed var(--border);
        background: rgba(255,255,255,0.015);
        border-radius: 14px;
        padding: 26px;
        text-align: center;
        color: var(--muted);
      }

      @media (max-width: 640px) {
        body { padding: 22px 14px 50px; }
        header { align-items: flex-start; }
        .toolbar { width: 100%; }
        .toolbar button { flex: 1; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Catalog Admin</h1>
        <div class="toolbar">
          <button id="addArtistBtn" type="button">Add artist</button>
          <button id="addTrackBtn" type="button">Add track</button>
          <button id="saveBtn" class="primary" type="button">Save catalog.json</button>
        </div>
      </header>

      <div id="status" class="status">Loading catalog…</div>

      <div class="stats">
        <div class="stat-card">
          <span class="stat-label">Artists</span>
          <span id="artistCount" class="stat-value">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Tracks</span>
          <span id="trackCount" class="stat-value">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Tags</span>
          <span id="tagCount" class="stat-value">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Triggers</span>
          <span id="triggerCount" class="stat-value">0</span>
        </div>
      </div>

      <section class="section">
        <div class="section-head">
          <h2>Artists</h2>
        </div>
        <div id="artistsList" class="items"></div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2>Tracks</h2>
        </div>
        <div id="tracksList" class="items"></div>
      </section>
    </div>

    <script>
      const state = {
        data: { artists: [], tracks: [] },
        expandedArtists: new Set(),
        expandedTracks: new Set()
      };

      const statusEl = document.getElementById('status');
      const artistsList = document.getElementById('artistsList');
      const tracksList = document.getElementById('tracksList');
      const artistCountEl = document.getElementById('artistCount');
      const trackCountEl = document.getElementById('trackCount');
      const tagCountEl = document.getElementById('tagCount');
      const triggerCountEl = document.getElementById('triggerCount');

      function setStatus(message, tone = 'info') {
        statusEl.textContent = message;
        statusEl.style.borderColor = tone === 'error'
          ? 'rgba(255, 123, 123, 0.5)'
          : tone === 'success'
            ? 'rgba(113, 229, 167, 0.45)'
            : 'rgba(138, 215, 255, 0.24)';
        statusEl.style.background = tone === 'error'
          ? 'rgba(255, 123, 123, 0.08)'
          : tone === 'success'
            ? 'rgba(113, 229, 167, 0.08)'
            : 'rgba(138, 215, 255, 0.08)';
      }

      function slugify(value = '') {
        return String(value)
          .toLowerCase()
          .trim()
          .replace(/\s+/g, '-')
          .replace(/[^a-z0-9-]+/g, '')
          .replace(/-+/g, '-')
          .replace(/^-+|-+$/g, '');
      }

      function parseTags(value) {
        return String(value || '')
          .split(',')
          .map((item) => item.trim())
          .filter(Boolean);
      }

      function stripAssetPrefix(value, prefix) {
        const raw = String(value || '').trim();
        if (!raw) return '';
        if (raw.startsWith(prefix)) return raw.slice(prefix.length);
        return raw;
      }

      function normalizePhotoValue(value, prefix) {
        const raw = String(value || '').trim();
        if (!raw) return '';
        if (/^(https?:|data:)/.test(raw)) return raw;
        const cleaned = raw.replace(/^.*[\\/]/, '');
        if (!cleaned) return '';
        return `${prefix}${cleaned}`;
      }

      function createArtist(overrides = {}) {
        const index = state.data.artists.length + 1;
        return {
          id: `artist-${index}`,
          slug: `artist-${index}`,
          name: `Artist ${index}`,
          genre: 'Ambient / Electronic / Soundscapes',
          bio: '',
          avatar: '/images/artists/artist-avatar.svg',
          banner: '/images/artists/artist-banner.svg',
          socials: {
            website: '',
            spotify: '',
            bandcamp: ''
          },
          ...overrides
        };
      }

      function createTrack(overrides = {}) {
        const index = state.data.tracks.length + 1;
        return {
          id: `track-${String(index).padStart(3, '0')}`,
          slug: `track-${index}`,
          title: `Track ${index}`,
          artist: state.data.artists[0]?.name || 'Artist Name',
          artwork: '/images/covers/track-cover.svg',
          audioUrl: 'https://example.com/audio/track.mp3',
          description: '',
          duration: '0:00',
          releaseDate: '',
          audience: 'General',
          tags: ['Ambient'],
          triggers: [],
          fileSize: '',
          bitrate: '',
          bpm: '',
          key: '',
          format: 'MP3',
          ...overrides
        };
      }

      function renderArtistCard(artist, index) {
        const isOpen = state.expandedArtists.has(index);
        const item = document.createElement('div');
        item.className = 'item-card';
        item.innerHTML = `
          <div class="item-header item-summary" data-open-artist="${index}">
            <div class="summary-main">
              <span class="summary-label">Artist</span>
              <strong>${escapeHtml(artist.name || `Artist ${index + 1}`)}</strong>
            </div>
            <div class="summary-actions">
              <button type="button" class="ghost" data-open-artist="${index}">${isOpen ? 'Hide' : 'Edit'}</button>
              <button type="button" class="danger" data-remove-artist="${index}">Remove</button>
            </div>
          </div>
          <div class="details ${isOpen ? 'open' : ''}">
            <div class="grid">
              <div class="field">
                <label>id</label>
                <input data-field="artists.${index}.id" value="${escapeHtml(artist.id || '')}" />
              </div>
              <div class="field">
                <label>slug</label>
                <input data-field="artists.${index}.slug" value="${escapeHtml(artist.slug || '')}" />
              </div>
              <div class="field full">
                <label>name</label>
                <input data-field="artists.${index}.name" value="${escapeHtml(artist.name || '')}" />
              </div>
              <div class="field">
                <label>genre</label>
                <input data-field="artists.${index}.genre" value="${escapeHtml(artist.genre || '')}" />
              </div>
              <div class="field full">
                <label>bio</label>
                <textarea data-field="artists.${index}.bio">${escapeHtml(artist.bio || '')}</textarea>
              </div>
              <div class="field">
                <label>avatar</label>
                <input data-photo-field="artists.${index}.avatar" data-base-path="/images/artists/" value="${escapeHtml(stripAssetPrefix(artist.avatar || '', '/images/artists/'))}" />
                <input type="file" accept="image/*" data-upload-field="artists.${index}.avatar" data-base-path="/images/artists/" style="margin-top: 8px;" />
              </div>
              <div class="field">
                <label>banner</label>
                <input data-photo-field="artists.${index}.banner" data-base-path="/images/artists/" value="${escapeHtml(stripAssetPrefix(artist.banner || '', '/images/artists/'))}" />
                <input type="file" accept="image/*" data-upload-field="artists.${index}.banner" data-base-path="/images/artists/" style="margin-top: 8px;" />
              </div>
              <div class="field">
                <label>website</label>
                <input data-field="artists.${index}.socials.website" value="${escapeHtml(artist.socials?.website || '')}" />
              </div>
              <div class="field">
                <label>spotify</label>
                <input data-field="artists.${index}.socials.spotify" value="${escapeHtml(artist.socials?.spotify || '')}" />
              </div>
              <div class="field">
                <label>bandcamp</label>
                <input data-field="artists.${index}.socials.bandcamp" value="${escapeHtml(artist.socials?.bandcamp || '')}" />
              </div>
            </div>
          </div>
        `;
        return item;
      }

      function renderTrackCard(track, index) {
        const isOpen = state.expandedTracks.has(index);
        const item = document.createElement('div');
        item.className = 'item-card';
        item.innerHTML = `
          <div class="item-header item-summary" data-open-track="${index}">
            <div class="summary-main">
              <span class="summary-label">Track</span>
              <strong>${escapeHtml(track.title || `Track ${index + 1}`)}</strong>
            </div>
            <div class="summary-actions">
              <button type="button" class="ghost" data-open-track="${index}">${isOpen ? 'Hide' : 'Edit'}</button>
              <button type="button" class="danger" data-remove-track="${index}">Remove</button>
            </div>
          </div>
          <div class="details ${isOpen ? 'open' : ''}">
            <div class="grid">
              <div class="field">
                <label>id</label>
                <input data-field="tracks.${index}.id" value="${escapeHtml(track.id || '')}" />
              </div>
              <div class="field">
                <label>slug</label>
                <input data-field="tracks.${index}.slug" value="${escapeHtml(track.slug || '')}" />
              </div>
              <div class="field full">
                <label>title</label>
                <input data-field="tracks.${index}.title" value="${escapeHtml(track.title || '')}" />
              </div>
              <div class="field">
                <label>artist</label>
                <input data-field="tracks.${index}.artist" value="${escapeHtml(track.artist || '')}" />
              </div>
              <div class="field">
                <label>artwork</label>
                <input data-photo-field="tracks.${index}.artwork" data-base-path="/images/covers/" value="${escapeHtml(stripAssetPrefix(track.artwork || '', '/images/covers/'))}" />
                <input type="file" accept="image/*" data-upload-field="tracks.${index}.artwork" data-base-path="/images/covers/" style="margin-top: 8px;" />
              </div>
              <div class="field full">
                <label>audioUrl</label>
                <input data-field="tracks.${index}.audioUrl" value="${escapeHtml(track.audioUrl || '')}" />
              </div>
              <div class="field full">
                <label>description</label>
                <textarea data-field="tracks.${index}.description">${escapeHtml(track.description || '')}</textarea>
              </div>
              <div class="field">
                <label>duration</label>
                <input data-field="tracks.${index}.duration" value="${escapeHtml(track.duration || '')}" />
              </div>
              <div class="field">
                <label>releaseDate</label>
                <input data-field="tracks.${index}.releaseDate" value="${escapeHtml(track.releaseDate || '')}" />
              </div>
              <div class="field">
                <label>audience</label>
                <input data-field="tracks.${index}.audience" value="${escapeHtml(track.audience || '')}" />
              </div>
              <div class="field">
                <label>tags</label>
                <input data-field="tracks.${index}.tags" value="${escapeHtml((track.tags || []).join(', '))}" />
              </div>
              <div class="field">
                <label>triggers</label>
                <input data-field="tracks.${index}.triggers" value="${escapeHtml((track.triggers || []).join(', '))}" />
              </div>
              <div class="field">
                <label>fileSize</label>
                <input data-field="tracks.${index}.fileSize" value="${escapeHtml(track.fileSize || '')}" />
              </div>
              <div class="field">
                <label>bitrate</label>
                <input data-field="tracks.${index}.bitrate" value="${escapeHtml(track.bitrate || '')}" />
              </div>
              <div class="field">
                <label>bpm</label>
                <input data-field="tracks.${index}.bpm" value="${escapeHtml(track.bpm || '')}" />
              </div>
              <div class="field">
                <label>key</label>
                <input data-field="tracks.${index}.key" value="${escapeHtml(track.key || '')}" />
              </div>
              <div class="field">
                <label>format</label>
                <input data-field="tracks.${index}.format" value="${escapeHtml(track.format || '')}" />
              </div>
            </div>
          </div>
        `;
        return item;
      }

      function escapeHtml(value = '') {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function updateCounts() {
        const artistLen = state.data.artists.length;
        const trackLen = state.data.tracks.length;
        const allTags = new Set();
        const allTriggers = new Set();

        state.data.tracks.forEach((track) => {
          (track.tags || []).forEach((tag) => allTags.add(String(tag).trim()));
          (track.triggers || []).forEach((trigger) => allTriggers.add(String(trigger).trim()));
        });

        artistCountEl.textContent = String(artistLen);
        trackCountEl.textContent = String(trackLen);
        tagCountEl.textContent = String(allTags.size);
        triggerCountEl.textContent = String(allTriggers.size);
      }

      function render() {
        artistsList.innerHTML = '';
        tracksList.innerHTML = '';

        if (!state.data.artists.length) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = 'No artists yet — click “Add artist” to begin.';
          artistsList.appendChild(empty);
        } else {
          state.data.artists.forEach((artist, index) => {
            artistsList.appendChild(renderArtistCard(artist, index));
          });
        }

        if (!state.data.tracks.length) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = 'No tracks yet — click “Add track” to begin.';
          tracksList.appendChild(empty);
        } else {
          state.data.tracks.forEach((track, index) => {
            tracksList.appendChild(renderTrackCard(track, index));
          });
        }

        updateCounts();
        bindEvents();
      }

      function bindEvents() {
        document.querySelectorAll('[data-field]').forEach((input) => {
          input.addEventListener('input', (event) => {
            const path = event.target.getAttribute('data-field');
            applyFieldUpdate(path, event.target.value);
          });
        });

        document.querySelectorAll('[data-photo-field]').forEach((input) => {
          input.addEventListener('input', (event) => {
            const path = event.target.getAttribute('data-photo-field');
            const basePath = event.target.getAttribute('data-base-path') || '/images/';
            applyFieldUpdate(path, normalizePhotoValue(event.target.value, basePath));
          });
        });

        document.querySelectorAll('[data-upload-field]').forEach((input) => {
          input.addEventListener('change', (event) => {
            const file = event.target.files && event.target.files[0];
            if (!file) return;
            const path = event.target.getAttribute('data-upload-field');
            const basePath = event.target.getAttribute('data-base-path') || '/images/';
            const value = normalizePhotoValue(file.name, basePath);
            applyFieldUpdate(path, value);

            const displayInput = document.querySelector(`[data-photo-field="${path}"]`);
            if (displayInput) {
              displayInput.value = stripAssetPrefix(value, basePath);
            }
          });
        });

        document.querySelectorAll('[data-open-artist]').forEach((button) => {
          button.addEventListener('click', () => {
            const index = Number(button.getAttribute('data-open-artist'));
            if (state.expandedArtists.has(index)) {
              state.expandedArtists.delete(index);
            } else {
              state.expandedArtists.clear();
              state.expandedArtists.add(index);
            }
            render();
          });
        });

        document.querySelectorAll('[data-open-track]').forEach((button) => {
          button.addEventListener('click', () => {
            const index = Number(button.getAttribute('data-open-track'));
            if (state.expandedTracks.has(index)) {
              state.expandedTracks.delete(index);
            } else {
              state.expandedTracks.clear();
              state.expandedTracks.add(index);
            }
            render();
          });
        });

        document.querySelectorAll('[data-remove-artist]').forEach((button) => {
          button.addEventListener('click', () => {
            const index = Number(button.getAttribute('data-remove-artist'));
            state.data.artists.splice(index, 1);
            state.expandedArtists.delete(index);
            render();
          });
        });

        document.querySelectorAll('[data-remove-track]').forEach((button) => {
          button.addEventListener('click', () => {
            const index = Number(button.getAttribute('data-remove-track'));
            state.data.tracks.splice(index, 1);
            state.expandedTracks.delete(index);
            render();
          });
        });
      }

      function applyFieldUpdate(path, value) {
        const segments = path.split('.');
        const target = segments.shift();
        if (!target) return;

        const list = state.data[target];
        if (!Array.isArray(list)) return;

        const indexStr = segments.shift();
        const index = Number(indexStr);
        if (Number.isNaN(index) || !list[index]) return;

        let current = list[index];

        while (segments.length > 1) {
          const key = segments.shift();
          current = current[key] ?? (current[key] = {});
        }

        const key = segments[0];

        if (key === 'avatar' || key === 'banner' || key === 'artwork') {
          const basePath = document.querySelector(`[data-photo-field="${path}"]`)?.getAttribute('data-base-path') || '/images/';
          current[key] = normalizePhotoValue(value, basePath);
        } else if (key === 'tags' || key === 'triggers') {
          current[key] = parseTags(value);
        } else if (key === 'socials') {
          current.socials = current.socials || {};
          current.socials[segments[1]] = value;
        } else {
          current[key] = value;
        }

        if ((key === 'name' || key === 'title') && typeof current[key] === 'string') {
          const base = current[key].trim();
          if (base && !current.slug) {
            current.slug = slugify(base);
          }
        }

        if (key === 'slug' && current.slug) {
          current.slug = slugify(current.slug);
        }

        if (target === 'artists' && key === 'slug') {
          current.slug = slugify(current.slug);
        }

        if (target === 'tracks' && key === 'title') {
          const track = current;
          if (track.slug && !track.slug.trim()) {
            track.slug = slugify(track.title);
          }
        }

        render();
      }

      async function loadCatalog() {
        try {
          const response = await fetch('/data/catalog.json', { cache: 'no-store' });
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          const json = await response.json();
          state.data = {
            artists: Array.isArray(json.artists) ? json.artists : [],
            tracks: Array.isArray(json.tracks) ? json.tracks : []
          };
          setStatus('Catalog loaded from /data/catalog.json', 'success');
          render();
        } catch (error) {
          console.warn('Unable to load catalog.json:', error);
          state.data = { artists: [createArtist()], tracks: [createTrack()] };
          setStatus('Could not load the saved file. A new blank catalog is ready for editing.', 'warn');
          render();
        }
      }

      function serializeCatalog() {
        const cleaned = {
          artists: state.data.artists.map((artist) => ({
            id: String(artist.id || '').trim(),
            slug: String(artist.slug || '').trim(),
            name: String(artist.name || '').trim(),
            genre: String(artist.genre || '').trim(),
            bio: String(artist.bio || '').trim(),
            avatar: String(artist.avatar || '').trim(),
            banner: String(artist.banner || '').trim(),
            socials: {
              website: String(artist.socials?.website || '').trim(),
              spotify: String(artist.socials?.spotify || '').trim(),
              bandcamp: String(artist.socials?.bandcamp || '').trim()
            }
          })),
          tracks: state.data.tracks.map((track) => ({
            id: String(track.id || '').trim(),
            slug: String(track.slug || '').trim(),
            title: String(track.title || '').trim(),
            artist: String(track.artist || '').trim(),
            artwork: String(track.artwork || '').trim(),
            audioUrl: String(track.audioUrl || '').trim(),
            description: String(track.description || '').trim(),
            duration: String(track.duration || '').trim(),
            releaseDate: String(track.releaseDate || '').trim(),
            audience: String(track.audience || '').trim(),
            tags: Array.isArray(track.tags) ? track.tags.map((tag) => String(tag).trim()).filter(Boolean) : [],
            triggers: Array.isArray(track.triggers) ? track.triggers.map((tag) => String(tag).trim()).filter(Boolean) : [],
            fileSize: String(track.fileSize || '').trim(),
            bitrate: String(track.bitrate || '').trim(),
            bpm: String(track.bpm || '').trim(),
            key: String(track.key || '').trim(),
            format: String(track.format || '').trim()
          }))
        };

        return JSON.stringify(cleaned, null, 2) + '\n';
      }

      async function saveCatalog() {
        const json = serializeCatalog();

        try {
          if ('showSaveFilePicker' in window) {
            const handle = await window.showSaveFilePicker({
              suggestedName: 'catalog.json',
              types: [{ description: 'JSON file', accept: { 'application/json': ['.json'] } }]
            });
            const writer = await handle.createWritable();
            await writer.write(json);
            await writer.close();
            setStatus('catalog.json saved successfully.', 'success');
            return;
          }

          const blob = new Blob([json], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'catalog.json';
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          setStatus('Your catalog.json has been downloaded. Save it into public/data/catalog.json.', 'success');
        } catch (error) {
          console.error(error);
          setStatus('Save failed in this browser. Use the downloaded JSON file to replace public/data/catalog.json manually.', 'error');
        }
      }

      document.getElementById('addArtistBtn').addEventListener('click', () => {
        state.data.artists.push(createArtist());
        render();
      });

      document.getElementById('addTrackBtn').addEventListener('click', () => {
        state.data.tracks.push(createTrack());
        render();
      });

      document.getElementById('saveBtn').addEventListener('click', saveCatalog);

      loadCatalog();
    </script>
  </body>
</html>
